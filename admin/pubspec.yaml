name: admin
description: "ResiQu - Package Transit Tracking System"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management, Routing, DI
  get: ^4.7.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.7
  google_sign_in: ^6.2.2

  # Utilities
  mobile_scanner: ^7.0.1
  intl: ^0.20.2
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  dice_bear: ^1.0.0

  # Export & Share
  excel: ^4.0.6
  pdf: ^3.11.2
  printing: ^5.13.4
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  syncfusion_flutter_datepicker: ^33.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
